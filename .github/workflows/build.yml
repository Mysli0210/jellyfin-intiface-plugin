# url=https://github.com/Mysli0210/jellyfin-intiface-plugin/blob/intiface-integration/.github/workflows/build.yml
name: Build Plugin

on:
  push:
    branches:
      - intiface-integration

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v3
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release

      - name: Find plugin output
        run: |
          # list all dlls built into bin/Release
          find . -type f -name "*.dll" -path "*/bin/Release/*" -print > artifact_paths.txt || true
          cat artifact_paths.txt || true

      - name: Package plugin folder(s)
        run: |
          # Create a zip containing all artifacts under bin/Release for easy download
          mkdir -p artifacts
          # Copy all build outputs (you can adjust the pattern if your csproj structure differs)
          while IFS= read -r file; do
            dir="$(dirname "$file")"
            # copy the entire containing folder (dll + deps) preserving structure under artifacts/
            dest="artifacts/$(echo "$dir" | sed 's#^\./##' )"
            mkdir -p "$dest"
            cp -r "$dir"/* "$dest"/ || true
          done < artifact_paths.txt || true
          # Zip artifacts
          zip -r jellyfin-intiface-plugin-build.zip artifacts || true
          ls -la

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-intiface-plugin
          path: |
            jellyfin-intiface-plugin-build.zip
            artifacts/**
