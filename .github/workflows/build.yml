name: Build and publish plugin

on:
  push:
    branches: [ intiface-integration ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 6
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Disable dotnet telemetry
        run: |
          echo "DOTNET_CLI_TELEMETRY_OPTOUT=1" >> $GITHUB_ENV

      - name: Restore
        run: dotnet restore TheHandyPlugin/TheHandyPlugin.csproj

      - name: Build (Release)
        run: dotnet build TheHandyPlugin/TheHandyPlugin.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish TheHandyPlugin/TheHandyPlugin.csproj --configuration Release --no-build -o ./output

      - name: List output files
        run: ls -la ./output || true

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-thehandy-plugin
          path: ./output
